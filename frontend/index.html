<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website RAG Chatbot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #151520;
      --bg-tertiary: #1e1e2e;
      --accent: #00ff88;
      --accent-dim: #00cc6a;
      --text-primary: #ffffff;
      --text-secondary: #a0a0b8;
      --border: rgba(255, 255, 255, 0.1);
      --shadow: rgba(0, 255, 136, 0.2);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Crimson Pro', serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: -50%; left: -50%; width: 200%; height: 200%;
      background: radial-gradient(circle at 20% 30%, rgba(0, 255, 136, 0.03) 0%, transparent 50%),
                  radial-gradient(circle at 80% 70%, rgba(0, 200, 255, 0.03) 0%, transparent 50%);
      animation: drift 20s ease-in-out infinite;
      pointer-events: none;
      z-index: -1;
    }

    @keyframes drift {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(-5%, 5%) rotate(5deg); }
    }

    /* Navbar Styling */
    nav {
      width: 100%;
      padding: 1.5rem 2rem;
      background: rgba(10, 10, 15, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-logo {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
      letter-spacing: 1px;
    }

    /* Main Container */
    .container {
      max-width: 850px;
      width: 100%;
      margin: 4rem auto;
      padding: 0 1rem;
      flex: 1;
      position: relative;
      z-index: 1;
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header { text-align: center; margin-bottom: 3rem; }

    .title {
      font-size: 3.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 2.5rem;
      margin-bottom: 2rem;
      backdrop-filter: blur(10px);
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .section-title {
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--accent);
      font-family: 'JetBrains Mono', monospace;
    }

    .input-group { display: flex; gap: 1rem; margin-bottom: 1rem; }

    .input-wrapper { flex: 1; }

    input {
      width: 100%;
      padding: 1rem 1.25rem;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text-primary);
      font-family: 'JetBrains Mono', monospace;
      outline: none;
      transition: all 0.3s;
    }

    input:focus { border-color: var(--accent); }

    button {
      padding: 1rem 2rem;
      background: var(--accent);
      color: var(--bg-primary);
      border: none;
      border-radius: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    button:hover { transform: translateY(-2px); box-shadow: 0 4px 15px var(--shadow); }
    button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 0.5rem 1rem;
      font-size: 0.75rem;
    }

    /* Chat Feed Styling */
    #chat-feed {
      max-height: 450px;
      overflow-y: auto;
      margin-bottom: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      padding-right: 10px;
    }

    .message {
      max-width: 85%;
      padding: 1.25rem;
      border-radius: 18px;
      line-height: 1.6;
      font-size: 1.05rem;
    }

    .message.user {
      align-self: flex-end;
      background: var(--bg-tertiary);
      border-bottom-right-radius: 4px;
    }

    .message.ai {
      align-self: flex-start;
      background: rgba(0, 255, 136, 0.05);
      border: 1px solid rgba(0, 255, 136, 0.1);
      border-bottom-left-radius: 4px;
    }

    .message strong { color: var(--accent); }
    .message.ai div p { margin-bottom: 0.8rem; }
    .message.ai div ul, .message.ai div ol { margin-left: 1.5rem; margin-bottom: 0.8rem; }

    .source-tag {
      display: block;
      margin-top: 0.8rem;
      font-size: 0.8rem;
      color: var(--text-secondary);
      font-family: 'JetBrains Mono', monospace;
      border-top: 1px solid var(--border);
      padding-top: 0.5rem;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem;
      background: var(--bg-tertiary);
      border-radius: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      opacity: 0;
      transition: 0.4s;
    }

    .status.active { opacity: 1; }

    .loader { display: none; padding: 1rem; gap: 0.5rem; }
    .loader.active { display: flex; }
    .loader-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; animation: bounce 1.4s infinite; }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

    /* Footer Styling */
    footer {
      width: 100%;
      padding: 3rem 2rem;
      text-align: center;
      border-top: 1px solid var(--border);
      background: rgba(10, 10, 15, 0.5);
      margin-top: auto;
    }

    .footer-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    #chat-feed::-webkit-scrollbar { width: 4px; }
    #chat-feed::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
  </style>
</head>
<body>
  
  <nav>
    <a href="#" class="nav-logo">WEBSITE-RAG-CHAT</a>
    <div class="footer-text" style="font-size: 0.75rem;">AI AGENT V1.0</div>
  </nav>

  <div class="container">
    <div class="header">
      <h1 class="title">RAG Chatbot</h1>
      <p style="color: var(--text-secondary);">Knowledge-grounded conversational intelligence</p>
    </div>

    <div class="card">
      <div class="section-title">01 — Source Integration</div>
      <div class="input-group" style="margin-top: 1.5rem;">
        <div class="input-wrapper">
          <input id="url" type="url" placeholder="https://example.com" />
        </div>
        <button id="indexBtn" onclick="ingest()">Index Site</button>
      </div>
      <div id="indexStatus" class="status">
        <div style="width: 8px; height: 8px; background: var(--accent); border-radius: 50%;"></div>
        <div class="status-text">Ready</div>
      </div>
    </div>

    <div class="card">
      <div class="section-header">
        <div class="section-title">02 — Conversational Feed</div>
        <button onclick="downloadAuditLog()" class="btn-outline">
          Export Audit Log
        </button>
      </div>
      
      <div id="chat-feed"></div>
      
      <div id="loader" class="loader">
        <div class="loader-dot"></div><div class="loader-dot"></div><div class="loader-dot"></div>
      </div>

      <div class="input-group">
        <div class="input-wrapper">
          <input id="question" type="text" placeholder="Ask anything about the website..." />
        </div>
        <button onclick="ask()">Send</button>
      </div>
    </div>
  </div>

  <footer>
    <p class="footer-text">Built with Retrieval-Augmented Generation Technology</p>
    <p class="footer-text" style="color: var(--accent); margin-top: 0.5rem;">By Kajal</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
